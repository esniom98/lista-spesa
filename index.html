<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Spesa</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, push, update, remove
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDIllLDwjjYx6kD_l19oew6XBsxHevFrQI",
    authDomain: "lista-spesa-d32fd.firebaseapp.com",
    databaseURL: "https://lista-spesa-d32fd-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-spesa-d32fd",
    storageBucket: "lista-spesa-d32fd.firebasestorage.app",
    messagingSenderId: "418606100752",
    appId: "1:418606100752:web:2460e01ca9f0ad7453f595"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- Categorie ----
  const CATEGORIES = [
    { id: "fresco",     label: "Fresco",         color: "#5c8a5c" },
    { id: "dispensa",   label: "Dispensa",       color: "#b98a3d" },
    { id: "surgelati",  label: "Surgelati",      color: "#4f7d9c" },
    { id: "casa",       label: "Casa e cura",    color: "#8a6a9c" },
    { id: "bevande",    label: "Bevande",        color: "#a25c5c" },
    { id: "altro",      label: "Altro",          color: "#8a8578" },
  ];
  const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
  const DEFAULT_CAT = "altro";
  let activeCategory = DEFAULT_CAT;

  // ---- Normalizzazione codice gruppo ----
  function normalizeGroup(raw) {
    return raw
      .trim()
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // rimuove accenti
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  // ---- Elementi login ----
  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.getElementById("app-screen");
  const loginForm = document.getElementById("login-form");
  const groupInput = document.getElementById("group-input");
  const loginError = document.getElementById("login-error");
  const groupLabel = document.getElementById("group-label");
  const switchGroupBtn = document.getElementById("switch-group");

  let listRef = null;
  let items = {};
  let unsubscribe = null;

  const STORAGE_KEY = "spesa_gruppo";

  function enterGroup(groupId) {
    const clean = normalizeGroup(groupId);
    if (!clean) {
      loginError.textContent = "Inserisci un codice valido (es. \"casa-rossi\").";
      loginError.style.display = "block";
      return;
    }
    localStorage.setItem(STORAGE_KEY, clean);
    listRef = ref(db, "spesa/" + clean);
    groupLabel.textContent = clean;
    loginScreen.style.display = "none";
    appScreen.style.display = "block";

    if (unsubscribe) unsubscribe();
    unsubscribe = onValue(listRef, (snapshot) => {
      items = snapshot.val() || {};
      render();
      statusDot.classList.remove("offline");
    }, () => {
      statusDot.classList.add("offline");
    });
  }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    loginError.style.display = "none";
    enterGroup(groupInput.value);
  });

  switchGroupBtn.addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    appScreen.style.display = "none";
    loginScreen.style.display = "flex";
    groupInput.value = "";
    groupInput.focus();
  });

  // Auto-login se già salvato
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    enterGroup(saved);
  } else {
    groupInput.focus();
  }

  // ---- Elementi app ----
  const form = document.getElementById("add-form");
  const input = document.getElementById("item-input");
  const qtyInput = document.getElementById("qty-input");
  const catPicker = document.getElementById("cat-picker");
  const listEl = document.getElementById("list");
  const emptyState = document.getElementById("empty-state");
  const countEl = document.getElementById("count");
  const clearBtn = document.getElementById("clear-done");
  const statusDot = document.getElementById("status-dot");

  for (const cat of CATEGORIES) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "cat-chip" + (cat.id === activeCategory ? " active" : "");
    chip.dataset.cat = cat.id;
    chip.style.setProperty("--chip-color", cat.color);
    chip.innerHTML = `<span class="dot"></span>${cat.label}`;
    chip.addEventListener("click", () => {
      activeCategory = cat.id;
      catPicker.querySelectorAll(".cat-chip").forEach(c => c.classList.toggle("active", c.dataset.cat === cat.id));
    });
    catPicker.appendChild(chip);
  }

  function render() {
    const entries = Object.entries(items);
    listEl.innerHTML = "";

    emptyState.style.display = entries.length === 0 ? "block" : "none";

    const groups = {};
    for (const [id, item] of entries) {
      const catId = CAT_MAP[item.cat] ? item.cat : DEFAULT_CAT;
      (groups[catId] ||= []).push([id, item]);
    }
    for (const catId in groups) {
      groups[catId].sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
    }

    let remaining = 0;

    for (const cat of CATEGORIES) {
      const group = groups[cat.id];
      if (!group || group.length === 0) continue;

      const section = document.createElement("li");
      section.className = "cat-section";

      const heading = document.createElement("div");
      heading.className = "cat-heading";
      heading.innerHTML = `<span class="dot" style="--chip-color:${cat.color}"></span>${cat.label}`;
      section.appendChild(heading);

      const sublist = document.createElement("ul");
      sublist.className = "sublist";

      for (const [id, item] of group) {
        if (!item.done) remaining++;

        const li = document.createElement("li");
        li.className = "item" + (item.done ? " done" : "");

        const check = document.createElement("button");
        check.className = "check";
        check.style.setProperty("--chip-color", cat.color);
        check.setAttribute("aria-label", item.done ? "Segna da comprare" : "Segna come preso");
        check.innerHTML = item.done
          ? '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 14.5L16 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : "";
        check.addEventListener("click", () => {
          update(ref(db, `spesa/${groupLabel.textContent}/${id}`), { done: !item.done });
        });

        const label = document.createElement("span");
        label.className = "label";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        label.appendChild(name);
        if (item.qty) {
          const qty = document.createElement("span");
          qty.className = "qty";
          qty.textContent = item.qty;
          label.appendChild(qty);
        }

        const del = document.createElement("button");
        del.className = "del";
        del.setAttribute("aria-label", "Rimuovi");
        del.innerHTML = '<svg viewBox="0 0 20 20" fill="none"><path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
        del.addEventListener("click", () => {
          remove(ref(db, `spesa/${groupLabel.textContent}/${id}`));
        });

        li.appendChild(check);
        li.appendChild(label);
        li.appendChild(del);
        sublist.appendChild(li);
      }

      section.appendChild(sublist);
      listEl.appendChild(section);
    }

    countEl.textContent = remaining === 0
      ? (entries.length ? "Tutto preso" : "")
      : remaining === 1 ? "1 da prendere" : remaining + " da prendere";

    clearBtn.style.display = entries.some(([, it]) => it.done) ? "inline-flex" : "none";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name || !listRef) return;
    const qty = qtyInput.value.trim();
    const order = Date.now();
    push(listRef, { name, qty, done: false, order, cat: activeCategory });
    input.value = "";
    qtyInput.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", () => {
    const updates = {};
    for (const [id, item] of Object.entries(items)) {
      if (item.done) updates[`spesa/${groupLabel.textContent}/${id}`] = null;
    }
    update(ref(db), updates);
  });
</script>
<style>
  :root{
    --paper:#ffffff;
    --surface:#fafaf9;
    --ink:#222220;
    --ink-soft:#8a8781;
    --accent:#3a3a36;
    --line:#e7e5df;
    --card:#ffffff;
    --danger:#b3503f;
    --chip-bg:#f4f3ef;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    padding:36px 16px 48px;
  }

  /* ---- Login ---- */
  #login-screen{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;
    max-width:340px;
    text-align:center;
  }
  .login-box h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .login-box p{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 28px;
    line-height:1.5;
  }
  #login-form{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #group-input{
    font-size:16px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    text-align:center;
  }
  #group-input:focus{ border-color:var(--accent); }
  #group-input::placeholder{ color:#b8b5ae; }
  .login-btn{
    font-size:15px;
    font-weight:600;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition:opacity .15s;
  }
  .login-btn:hover{ opacity:0.88; }
  .login-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:16px;
    line-height:1.5;
  }
  .login-error{
    display:none;
    font-size:13px;
    color:var(--danger);
    margin-top:4px;
  }

  /* ---- App ---- */
  #app-screen{ display:none; width:100%; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .title-group{
    display:flex;
    flex-direction:column;
  }
  h1{
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
    color:var(--ink);
  }
  .status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  #status-dot{
    width:6px;height:6px;border-radius:50%;
    background:#5c8a5c;
    transition:background .3s;
  }
  #status-dot.offline{background:var(--danger);}
  #switch-group{
    background:none;
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  #switch-group:hover{ border-color:var(--ink-soft); }

  #add-form{
    display:flex;
    gap:8px;
    margin:22px 0 12px;
  }
  #item-input{ flex:1; min-width:0; }
  #qty-input{ width:72px; flex-shrink:0; }
  #item-input, #qty-input{
    font-size:16px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  #item-input:focus, #qty-input:focus{ border-color:var(--accent); }
  #item-input::placeholder, #qty-input::placeholder{ color:#b8b5ae; }
  .add-btn{
    flex-shrink:0;
    width:46px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .15s;
  }
  .add-btn:hover{ opacity:0.88; }
  .add-btn:active{ transform:scale(0.96); }

  #cat-picker{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:24px;
    scrollbar-width:none;
  }
  #cat-picker::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--chip-bg);
    border:1.5px solid transparent;
    border-radius:20px;
    padding:6px 12px 6px 10px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .cat-chip .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--chip-color, var(--ink-soft));
    flex-shrink:0;
  }
  .cat-chip.active{
    border-color:var(--chip-color, var(--accent));
    color:var(--ink);
  }

  .list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
    min-height:18px;
  }
  .clear-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-family:inherit;
    font-size:12.5px;
    cursor:pointer;
    padding:2px 0;
    display:none;
    align-items:center;
  }

  ul#list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .cat-section{ display:flex; flex-direction:column; }
  .cat-heading{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.2px;
    color:var(--ink-soft);
    margin-bottom:8px;
    padding-left:2px;
  }
  .cat-heading .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--chip-color);
    flex-shrink:0;
  }

  ul.sublist{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 12px;
  }
  .check{
    flex-shrink:0;
    width:24px;height:24px;
    border-radius:50%;
    border:1.8px solid var(--chip-color, var(--accent));
    background:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    padding:0;
    transition:background .15s, border-color .15s;
  }
  .item.done .check{ background:var(--chip-color, var(--accent)); }
  .check svg{width:14px;height:14px;}

  .label{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:15.5px;
  }
  .name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .qty{
    flex-shrink:0;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--surface);
    padding:2px 8px;
    border-radius:20px;
  }
  .item.done .name{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--ink-soft);
  }
  .item.done .qty{ opacity:0.6; }

  .del{
    flex-shrink:0;
    width:26px;height:26px;
    border:none;
    background:none;
    color:#cfccc3;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
  }
  .del:hover{color:var(--danger);}
  .del svg{width:14px;height:14px;}

  #empty-state{
    display:none;
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  #empty-state .icon{
    font-size:30px;
    margin-bottom:10px;
    opacity:0.4;
  }
  #empty-state p{
    font-size:14px;
    margin:0;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1c1a;
      --surface:#141412;
      --ink:#f0efe9;
      --ink-soft:#9b988f;
      --accent:#e8e6de;
      --line:#302f2b;
      --card:#1c1c1a;
      --danger:#e08b78;
      --chip-bg:#232320;
    }
    :root:not([data-theme="light"]) .add-btn,
    :root:not([data-theme="light"]) .login-btn{ color:#141412; }
  }
  :root[data-theme="dark"]{
    --paper:#1c1c1a;
    --surface:#141412;
    --ink:#f0efe9;
    --ink-soft:#9b988f;
    --accent:#e8e6de;
    --line:#302f2b;
    --card:#1c1c1a;
    --danger:#e08b78;
    --chip-bg:#232320;
  }
  :root[data-theme="dark"] .add-btn,
  :root[data-theme="dark"] .login-btn{ color:#141412; }
</style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1>Spesa</h1>
      <p>Inserisci il codice del tuo gruppo per accedere alla lista condivisa. Se non esiste ancora, viene creata al volo.</p>
      <form id="login-form">
        <input id="group-input" type="text" placeholder="es. casa-rossi" autocomplete="off" required>
        <button type="submit" class="login-btn">Entra</button>
      </form>
      <p class="login-error" id="login-error"></p>
      <p class="login-hint">Chi conosce lo stesso codice vede e modifica la stessa lista, in tempo reale.</p>
    </div>
  </div>

  <div id="app-screen">
    <div class="app">
      <header>
        <div class="title-group">
          <h1>Spesa</h1>
          <div class="status"><span id="status-dot"></span><span id="group-label"></span></div>
        </div>
        <button id="switch-group">Cambia gruppo</button>
      </header>

      <form id="add-form">
        <input id="item-input" type="text" placeholder="Aggiungi un prodotto…" autocomplete="off" required>
        <input id="qty-input" type="text" placeholder="qtà" autocomplete="off">
        <button type="submit" class="add-btn" aria-label="Aggiungi">+</button>
      </form>

      <div id="cat-picker"></div>

      <div class="list-header">
        <span id="count"></span>
        <button id="clear-done" class="clear-btn">Rimuovi presi</button>
      </div>

      <ul id="list"></ul>

      <div id="empty-state">
        <div class="icon">🧺</div>
        <p>Il carrello è vuoto. Aggiungi il primo prodotto.</p>
      </div>
    </div>
  </div>

</body>
</html>
